<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Dark Background for High Contrast -->
  <rect width="512" height="512" rx="96" fill="#020617"/>
  
  <!-- Outer accent line -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#10b981" stroke-width="16" stroke-opacity="0.3"/>

  <!-- Maximized Bold 'MH' Typography for Tab Visibility -->
  <text x="50%" y="53%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="340" font-weight="900" fill="#34d399" letter-spacing="-8">MH</text>
</svg>
